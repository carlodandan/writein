        <h1>WriteIn — Private Desktop Studio for Fiction Writers</h1>
        <p>A calm, distraction-free desktop novel writing studio. 100% offline, local SQLite, infinite character relationship web, story bible, timeline, and standard MS Word (.docx) manuscript compiler. Zero subscriptions.</p>
        <h2>Core Features</h2>
        <ul>
          <li><strong>Offline-First &amp; Private:</strong> 100% local SQLite storage, zero cloud telemetry, zero subscriptions.</li>
          <li><strong>Manuscript Hierarchy:</strong> Organize Acts, Chapters, and Scenes with word count rollups.</li>
          <li><strong>Character Web:</strong> Visual node-graph canvas to connect protagonists, factions, and family trees.</li>
          <li><strong>Story Bible:</strong> Worldbuilding dossiers and narrative timelines with bidirectional linking.</li>
          <li><strong>MS Word (.docx) Compiler:</strong> Export submission-ready manuscripts directly.</li>
        </ul>
